<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>التذكيرات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6fb; --card:#ffffff; --ink:#14263d; --muted:#5d6f86; --line:#d9e1ec;
  --navy:#323467; --sky:#e3f1f9; --diamond:#7abfde; --alert:#b3261e; --ok:#1f7a4d;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#12132b; --card:#1b1d3d; --ink:#e9ecf7; --muted:#a3a8c6; --line:#2e3160; --navy:#a9c7f0; --sky:#222a4d; --alert:#ff8a80; --ok:#6fd3a0; }
}
*{box-sizing:border-box}
html{scroll-padding-top:16px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic',Tahoma,Arial,sans-serif;line-height:1.7;padding:16px}
.wrap{max-width:1000px;margin:auto}
header{display:flex;align-items:center;justify-content:space-between;margin:4px 0 16px}
h1{font-size:1.5rem;margin:0;color:var(--navy)}
h2{font-size:1.1rem;margin:0 0 12px;color:var(--navy)}
.grid{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:860px){.grid{grid-template-columns:380px 1fr;align-items:start}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
label{display:block;font-size:.9rem;color:var(--muted);margin:10px 0 4px}
input,select,textarea,button{font:inherit}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--navy);outline-offset:1px}
textarea{resize:vertical;min-height:60px}
.row{display:flex;gap:10px}.row>*{flex:1}
button{cursor:pointer;border:0;border-radius:8px;padding:10px 16px;background:var(--navy);color:#fff;font-weight:500}
@media (prefers-color-scheme: dark){button{color:#12132b}}
button.ghost{background:transparent;color:var(--navy);border:1px solid var(--line)}
button.danger{background:transparent;color:var(--alert);border:1px solid var(--line);padding:6px 12px;font-size:.85rem}
button.full{width:100%;margin-top:16px;padding:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;cursor:pointer;background:var(--bg);user-select:none}
.chip input{width:auto;margin:0}
.chip.on{background:var(--sky);border-color:var(--navy)}
.chip small{color:var(--muted);direction:ltr}
.x{border:0;background:none;color:var(--muted);padding:0 2px;font-size:1rem}
details{margin-top:12px}
summary{cursor:pointer;color:var(--navy)}
.item{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.item h3{margin:0;font-size:1rem}
.meta{color:var(--muted);font-size:.88rem}
.next{display:inline-block;margin-top:4px;padding:2px 10px;border-radius:999px;background:var(--sky);color:var(--navy);font-size:.85rem}
.empty{color:var(--muted);text-align:center;padding:24px 0}
.err{color:var(--alert);margin-top:8px;min-height:1.2em}
#overlay{position:fixed;inset:0;background:rgba(10,20,35,.6);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
#overlay.show{display:flex}
.alertbox{background:var(--card);border:3px solid var(--alert);border-radius:16px;max-width:420px;width:100%;padding:24px;text-align:center}
.alertbox .tag{color:var(--alert);font-weight:700;font-size:1.1rem}
.alertbox .big{font-size:3.5rem;font-weight:700;line-height:1.1;color:var(--alert);margin:8px 0}
.alertbox h3{margin:0 0 6px;font-size:1.3rem}
.alertbox p{margin:0 0 6px;color:var(--muted)}
@media (prefers-reduced-motion: no-preference){.alertbox{animation:pop .25s ease-out}@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}}
.setup{max-width:460px;margin:40px auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin:0 0 12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand .tile{width:52px;height:52px;border-radius:12px;flex:none}
.brand h1{font-size:1.15rem;line-height:1.3}
.brand small{display:block;color:var(--muted);font-size:.8rem}
.hr{background:#fff;border-radius:10px;padding:4px 10px;display:flex}
.hr img{height:40px;width:auto;display:block}
.tabs{display:flex;gap:8px;margin:0 0 16px;border-bottom:2px solid var(--line)}
.tab{background:none;color:var(--muted);border-radius:8px 8px 0 0;padding:10px 18px;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;font-weight:500}
.tab.on{color:var(--navy);border-bottom-color:var(--diamond)}
@media (prefers-color-scheme: dark){.tab{color:var(--muted)}.tab.on{color:var(--navy)}}
.dash{padding:0;overflow:hidden}
.dash iframe{width:100%;height:78vh;min-height:480px;border:0;display:block;background:#fff}
.dashbar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.dashbar a{color:var(--navy);text-decoration:none;font-size:.9rem}
.dashbar a:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<div id="overlay" role="alertdialog" aria-modal="true" aria-live="assertive">
  <div class="alertbox" id="alertbox"></div>

let api = API_URL || localStorage.getItem(LS_URL) || '';

const fmtDate = d => d.toLocaleDateString('ar-SA-u-nu-latn-ca-gregory', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
const fmtTime = d => d.toLocaleTimeString('ar-SA-u-nu-latn', { hour:'2-digit', minute:'2-digit' });

async function call(action, params = {}) {
  const u = new URL(api);
  u.searchParams.set('action', action);
  Object.entries(params).forEach(([k, v]) => u.searchParams.set(k, typeof v === 'string' ? v : JSON.stringify(v)));
  const r = await fetch(u.toString());
  const j = await r.json();
  if (j.error) throw new Error(j.error);
  return j;
}

function occurrences(r) {
  const [y, m] = r.start.split('-').map(Number);
  const [hh, mm] = r.time.split(':').map(Number);
  const out = [];
  for (let i = 0; i < r.months; i++) {
    const first = new Date(y, m - 1 + i, 1);
    const last = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
    out.push(new Date(first.getFullYear(), first.getMonth(), Math.min(r.day, last), hh, mm));
  }
  return out;
}

function renderSetup(msg) {
  $('#app').innerHTML = `
    <div class="card setup">
      <img src="${LOGO_TH}" alt="" style="width:64px;height:64px;border-radius:14px">
      <h1>التذكيرات</h1>
      <p class="meta">الصق رابط الـ Web App الخاص بالخلفية لربط التطبيق بالبيانات المشتركة.</p>
      <label for="u">رابط الربط</label>
      <input id="u" dir="ltr" placeholder="https://script.google.com/macros/s/.../exec">
      <button class="full" id="saveUrl">حفظ وفتح</button>
      <div class="err">${esc(msg || '')}</div>
    </div>`;
  $('#saveUrl').onclick = () => {
    const v = $('#u').value.trim();
    if (!/^https:\/\/script\.google\.com\//.test(v)) return renderSetup('الرابط غير صحيح');
    api = v; localStorage.setItem(LS_URL, v); load();
  };
}

function render() {
  const nowD = new Date();
  const items = state.reminders.map(r => {
    const occ = occurrences(r);
    const next = occ.find(o => o >= nowD);
    return { r, next, left: occ.filter(o => o >= nowD).length };
  }).sort((a, b) => (a.next ? a.next : 1e15) - (b.next ? b.next : 1e15));

  const days = Array.from({length:31}, (_, i) => `<option value="${i+1}" ${i+1===24?'selected':''}>${i+1}</option>`).join('');

      ${esc(c.name)} <small>${esc(c.email)}</small>

    </label>`).join('') || '<span class="meta">أضف أول اسم من الأسفل.</span>';

  $('#app').innerHTML = `

        <label for="m">التكرار</label>
        <select id="m">
          <option value="1">هذا الشهر فقط</option>
          <option value="2">شهران</option><option value="3">3 أشهر</option>
          <option value="6">6 أشهر</option><option value="12">سنة كاملة</option>
        </select>
        <label>من يصله التنبيه؟</label>
        <div class="chips" id="chips">${chips}</div>
        <details>
          <summary>إضافة اسم جديد</summary>
          <div class="row" style="margin-top:8px">
            <input id="cn" placeholder="الاسم">
            <input id="ce" type="email" dir="ltr" placeholder="name@email.com">
          </div>
          <button class="ghost" id="addC" style="margin-top:8px">إضافة الاسم</button>
        </details>
        <button class="full" id="save">حفظ التذكير</button>
        <div class="err" id="err"></div>
        <button class="ghost" id="reset" style="margin-top:8px;padding:6px 12px;font-size:.85rem">تغيير رابط الخلفية</button>
      </section>
      <section class="card">
        <h2>التذكيرات القادمة</h2>
        <div id="list">${items.map(({r, next, left}) => `
          <div class="item">
            <div>
              <h3>${esc(r.title)}</h3>
              ${r.notes ? `<div class="meta">${esc(r.notes)}</div>` : ''}
              <div class="meta">${esc(r.names.join('، ') || 'بدون مستلمين')}</div>
              <span class="next">${next ? `القادم: ${fmtDate(next)} ${fmtTime(next)} · متبقي ${left}` : 'انتهت كل المواعيد'}</span>
            </div>
            <button class="danger" data-del="${esc(r.id)}">حذف</button>
          </div>`).join('') || '<div class="empty">لا توجد تذكيرات بعد. أضف أول تذكير.</div>'}
        </div>
      </section>
    </div>`;

  $('#reset').onclick = () => { localStorage.removeItem(LS_URL); api = ''; renderSetup(); };
  document.querySelectorAll('.tab').forEach(b => b.onclick = () => { state.tab = b.dataset.tab; render(); });
  if (state.tab === 'dash') renderDash();
  $('#chips').addEventListener('change', e => {
    const id = e.target.dataset.c; if (!id) return;
    e.target.checked ? state.selected.add(id) : state.selected.delete(id);
    e.target.closest('.chip').classList.toggle('on', e.target.checked);
  });
  $('#chips').addEventListener('click', async e => {
    const id = e.target.dataset.delC; if (!id) return;
    e.preventDefault();
    if (!confirm('حذف هذا الاسم؟')) return;
    state.selected.delete(id);
    await call('deleteContact', { id }); load();
  });
  $('#addC').onclick = async () => {
    const name = $('#cn').value.trim(), email = $('#ce').value.trim();
    if (!name || !/^\S+@\S+\.\S+$/.test(email)) return ($('#err').textContent = 'اكتب الاسم وإيميلًا صحيحًا');
    await call('addContact', { data: { name, email } }); load();
  };
  $('#save').onclick = save;
  $('#list').addEventListener('click', async e => {
    const id = e.target.dataset.del; if (!id) return;
    if (!confirm('حذف هذا التذكير؟')) return;
    await call('delete', { id }); load();
  });
}

function renderDash() {
  const url = state.settings.dashboardUrl || '';
  const box = $('#dashView');
  if (!url) {
    box.innerHTML = `<div class="card" style="max-width:520px">
      <h2>ربط لوحة المسوح</h2>
      <p class="meta">الصق رابط الداشبورد (GitHub Pages) مرة واحدة، ويظهر لكل من يفتح التطبيق.</p>
      <label for="du">رابط الداشبورد</label>
      <input id="du" dir="ltr" placeholder="https://username.github.io/dashboard/">
      <button class="full" id="duSave">حفظ الرابط</button>
      <div class="err" id="duErr"></div></div>`;
    $('#duSave').onclick = () => saveDash($('#du').value.trim());
    return;
  }
  box.innerHTML = `<div class="card dash">
    <div class="dashbar"><a href="${esc(url)}" target="_blank" rel="noopener">فتح في صفحة جديدة</a>
      <button class="ghost" id="duChange" style="padding:6px 12px;font-size:.85rem">تغيير الرابط</button></div>
    <iframe src="${esc(url)}" title="لوحة المسوح" loading="lazy"></iframe></div>`;
  $('#duChange').onclick = () => { state.settings.dashboardUrl = ''; renderDash(); };
}
async function saveDash(v) {
  const err = $('#duErr');
  if (!/^https:\/\//.test(v)) return (err.textContent = 'الرابط يجب أن يبدأ بـ https://');
  try { await call('setSetting', { key: 'dashboardUrl', value: v }); state.settings.dashboardUrl = v; renderDash(); }
  catch (e) { err.textContent = 'تعذّر الحفظ: ' + e.message; }
}

async function save() {
  const err = $('#err'); err.textContent = '';
  const title = $('#t').value.trim();
  const picked = state.contacts.filter(c => state.selected.has(c.id));
  if (!title) return (err.textContent = 'اكتب عنوان التذكير');
  if (!picked.length) return (err.textContent = 'اختر اسمًا واحدًا على الأقل');
  const day = Number($('#d').value), time = $('#h').value || '08:00';
  const [hh, mm] = time.split(':').map(Number);
  const now = new Date();
  const thisMonth = new Date(now.getFullYear(), now.getMonth(), Math.min(day, new Date(now.getFullYear(), now.getMonth()+1, 0).getDate()), hh, mm);
  const s = thisMonth > now ? now : new Date(now.getFullYear(), now.getMonth() + 1, 1);
  const start = s.getFullYear() + '-' + String(s.getMonth() + 1).padStart(2, '0');
  $('#save').disabled = true;
  try {
    await call('add', { data: { title, notes: $('#n').value.trim(), day, time, months: Number($('#m').value), start, names: picked.map(c => c.name), emails: picked.map(c => c.email) } });
    state.selected.clear(); await load();
  } catch (e) { err.textContent = 'تعذّر الحفظ: ' + e.message; $('#save').disabled = false; }
}

async function load() {
  $('#app').innerHTML = '<div class="empty">جارٍ التحميل…</div>';
  try {
    const j = await call('list');
    state.reminders = j.reminders; state.contacts = j.contacts; state.settings = j.settings || {};
    render(); checkDue();
  } catch (e) { renderSetup('تعذّر الاتصال بالخلفية: ' + e.message); }
}

// التنبيه داخل البرنامج
const dismissed = () => { try { return JSON.parse(localStorage.getItem(LS_DONE) || '[]'); } catch { return []; } };
function checkDue() {
  const now = new Date(), done = dismissed();
  for (const r of state.reminders) {
    for (const o of occurrences(r)) {
      const age = now - o;
      const key = r.id + '|' + o.toISOString().slice(0, 10);
      if (age >= 0 && age < 24 * 3600 * 1000 && !done.includes(key)) return showAlert(r, o, key);
    }
  }
}
function showAlert(r, o, key) {
  $('#alertbox').innerHTML = `
    <div class="tag">🔴 تذكير عاجل</div>
    <div class="big">${o.getDate()}</div>
    <h3>${esc(r.title)}</h3>
    ${r.notes ? `<p>${esc(r.notes)}</p>` : ''}
    <p>${fmtDate(o)} · ${fmtTime(o)}</p>
    <button class="full" id="ok">تم الاطلاع</button>`;
  $('#overlay').classList.add('show');
  $('#ok').focus();
  $('#ok').onclick = () => {
    const d = dismissed(); d.push(key); localStorage.setItem(LS_DONE, JSON.stringify(d.slice(-200)));
    $('#overlay').classList.remove('show'); checkDue();
  };
  if ('Notification' in window) {
    if (Notification.permission === 'granted') new Notification('🔴 تذكير عاجل', { body: r.title });
    else if (Notification.permission === 'default') Notification.requestPermission();
  }
}

api ? load() : renderSetup();
setInterval(() => { if (api && state.reminders.length && !$('#overlay').classList.contains('show')) checkDue(); }, 30000);
</script>
</body>
</html>
